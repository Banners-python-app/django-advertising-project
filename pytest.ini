[pytest]
# 1. Point to your main Django settings folder name (replace 'my_project' with yours)
DJANGO_SETTINGS_MODULE = core.settings

# 2. Tell pytest to search all folders for these specific test filenames
python_files = tests.py test_*.py *_tests.py

# 3. Force Python to recognize your apps relative to the root directory
pythonpath = .

# 4. Skip searching inside your virtual environment or cache folders to save time
norecursedirs = venv .git .pytest_cache reports

# 5. Automatically create the JUnit XML report inside the reports folder on every run
addopts = --junitxml=reports/junit.xml
