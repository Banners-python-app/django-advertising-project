services:
  web:
    build: .
    container_name: banner
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    security_opt: 
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - banner-networks

networks:
  banner-networks:
    driver: bridge