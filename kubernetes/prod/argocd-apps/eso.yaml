# 1. ArgoCD tries to deploy a new ExternalSecret.

# 2.The Kubernetes API Server securely contacts the Webhook using the TLS certificates generated by the Cert Controller.

# 3. The Webhook says, "Yes, this YAML looks perfectly valid."

# 4. The API Server saves the configuration.

# 5. The Main Operator sees the new configuration, uses the IAM role, reaches out to AWS Secrets Manager, and safely creates your Kubernetes Secret.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"     # deploy after the promstack
spec:
  project: banner-python-prod     # this defines logical grouping inside argocd
  source:
    repoURL: 'https://charts.external-secrets.io'
    targetRevision: '0.9.18'
    chart: external-secrets
    helm: 
      values: |
        # crd management
        installCRDs: true

        # HA & leader election
        replicaCount: 2
        # 1 pod active (doing all work) & 2 is standby (but if pod 1 fails then 2 is taken place)
        leaderElect: true     

        # IRSA
        serviceAccount:
          create: true
          name: "external-secrets-sa"
          annotations:
            eks.amazonaws.com/role-arn: ""
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits: 
            cpu: 500m
            memory: 512Mi
        
        # enable metrics
        metrics:
          serviceMonitor:
            enabled: true

        # webhook (validator for externalsecrets, secretstore ) & cert controller(https communication bet api server & webhook)
        webhook:
          replicaCount: 2
          metrics:
            serviceMonitor:
              enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        certController:
          replicaCount: 2
          metrics:
            serviceMonitor:
              enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  
  # ignoredifferences helps ignoring "outofsync" resources which not in git repo
  # Ignore webhook certificate injections to prevent ArgoCD "Out of Sync" loops
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m