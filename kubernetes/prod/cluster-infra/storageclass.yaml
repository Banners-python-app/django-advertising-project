apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: banner-gp3-sc
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  kmsKeyId: ""
  tagSpecification_1: "Environment=production"
  tagSpecification_2: "Team=database-ops"
  tagSpecification_3: "Project=banner-erp"
reclaimPolicy: Retain   # if PV is released then AWS will preserve this volume
volumeBindingMode: WaitForFirstConsumer     
allowVolumeExpansion: true