# this file is docker-compose for Sonarqube
version: "3.8"

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    networks:
      - sonar-internal
    depends_on:
      - db
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=enterprise_secure_password
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"   # non root user
    ulimits:
      nproc:
        soft: 8192
        hard: 8192
      nofile:
        soft: 131072
        hard: 131072
    mem_limit: 4g
    cpus:  "2.0"
    

  db:
    image: postgres:15-alpine
    container_name: postgres_sonar
    networks:
      - sonar-internal
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=enterprise_secure_password
      - POSTGRES_DB=sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: always
    user: "70:70"
    mem_limit: 2g
    cpus: "1.0"

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:

networks:
  sonar-internal:
    driver: bridge