name: Shirdi hoardings checks

on:
    pull_request:
        branches: ['dev', 'main']
        types: [opened, synchronize, ready_for_review, reopened]
    push:
        branches: ['main']
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true  #true:old wk will be cancelled false: wait until finish old job
env:
    DEBUG: ${{ secrets.DEBUG }}
    SECRET_KEY: ${{ secrets.SECRET_KEY }} 

jobs:
    checkout-and-scanning:
        name: "Checkout and scanning"
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.13.9'
                cache: 'pip'
            - name: Install System Graphics Dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y libcairo2-dev pkg-config
            - name: Install dependencies
              run: pip install -r requirements.txt
            - name: Flake8 for linting
              run: |
                pip install flake8
                flake8 . --count --select=E9,F63,F72,F82 --show-source --statistics
                flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
            - name: Py Testing
              run: |
                python manage.py test
                

    deploy-to-prod-Vercel:
        name: "Deploy if earlier checks passed"
        runs-on: ubuntu-latest
        needs: checkout-and-scanning
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        steps:
            - name: Final deploy
              run: |
                curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
                echo "Webhook triggered successfully!"